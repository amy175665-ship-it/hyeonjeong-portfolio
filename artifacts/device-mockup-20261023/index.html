<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기기 목업 시안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap">
<style>
  @font-face {
    font-family: Pretendard;
    src: url("assets/PretendardVariable.woff2") format("woff2");
    font-weight: 100 900;
  }

  @font-face {
    font-family: "DM Serif Display";
    src: url("assets/DMSerifDisplay-Regular.ttf");
  }

  :root {
    --accent: #e96b5a;
    --ink: #202731;
    --muted: #58636e;
    --bezel: #0e1014;
    --bezel-edge: #3b4049;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    background: #121b33;
    font-family: Pretendard, sans-serif;
  }

  /* JAJAK 패널 (실제 사이트 WorkStory 패널을 옮김) */
  .panel {
    position: relative;
    height: max(600px, 100svh);
    overflow: hidden;
    color: #fff;
  }

  .field {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      115deg,
      color-mix(in srgb, var(--accent) 62%, #000) 0%,
      var(--accent) 55%,
      color-mix(in srgb, var(--accent) 55%, #fff) 100%
    );
  }

  .field::after {
    content: "";
    position: absolute;
    right: 8%;
    top: 18%;
    width: 34%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgb(255 255 255 / 0.5), rgb(255 255 255 / 0.04) 60%);
  }

  .shade {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgb(10 12 20 / 0.25) 0%, rgb(10 12 20 / 0) 30%, rgb(10 12 20 / 0.6) 100%);
  }

  .ticker {
    position: absolute;
    left: 0;
    right: 0;
    top: 30%;
    overflow: hidden;
  }

  .tickerTrack {
    display: flex;
    width: max-content;
    font:
      400 clamp(44px, 6.2vw, 104px) / 1.15 "DM Serif Display",
      "Noto Serif KR",
      serif;
    color: rgb(255 255 255 / 0.92);
    white-space: nowrap;
    animation: flow 30s linear infinite;
  }

  .tickerTrack span {
    padding-right: 0.3em;
  }

  @keyframes flow {
    to {
      transform: translateX(-50%);
    }
  }

  .meta {
    position: absolute;
    z-index: 3;
    right: 4.2%;
    top: 112px;
    display: grid;
    justify-items: end;
    gap: 8px;
    font-size: 14px;
    text-align: right;
  }

  .meta strong {
    font: 400 18px/1.3 "DM Serif Display", Georgia, serif;
  }

  .badge {
    padding: 4px 10px;
    border-radius: 999px;
    background: rgb(255 255 255 / 0.9);
    color: var(--muted);
    font-size: 12px;
  }

  .text {
    position: absolute;
    z-index: 3;
    left: 4.2%;
    bottom: 6%;
    max-width: 54%;
  }

  .title {
    margin: 0;
    font: 900 clamp(64px, 10.5vw, 176px) / 0.9 Pretendard, sans-serif;
    letter-spacing: -0.06em;
    text-shadow: 0 6px 40px rgb(0 0 0 / 0.25);
  }

  .foot {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 28px;
    margin-top: 22px;
  }

  .foot p {
    margin: 0;
    font-size: 16px;
  }

  .foot a {
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-underline-offset: 6px;
  }

  /* ---------- 기기 (레퍼런스: 위에서 살짝 내려다본 노트북, 얇은 테두리·노치·금속 질감) ---------- */
  .devices {
    position: absolute;
    z-index: 3;
    right: 6%;
    bottom: 9%;
    width: 46%;
    pointer-events: none;
  }

  .laptop {
    position: relative;
    animation: rise 1s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }

  /* 뚜껑: 얇은 금속 테두리 → 검은 베젤 → 화면. 화면 칸은 이미지 원래 비율 그대로 */
  .lid {
    position: relative;
    z-index: 2;
    width: 84%;
    margin: 0 auto;
    padding: 3px;
    border-radius: 18px 18px 4px 4px;
    background: linear-gradient(180deg, #5d6169, #2a2c31 18%, #1d1f23 70%, #3a3d43);
    box-shadow:
      0 0 0 1px rgb(0 0 0 / 0.5),
      0 40px 80px -30px rgb(0 0 0 / 0.7);
  }

  .bezel {
    position: relative;
    padding: 1.3% 1.3% 1.6%;
    border-radius: 15px 15px 2px 2px;
    background: #050506;
  }

  .screen {
    position: relative;
    overflow: hidden;
    border-radius: 6px 6px 1px 1px;
  }

  .screen img {
    display: block;
    width: 100%;
    height: auto;
  }

  /* 유리 반사: 왼쪽 위에서 비스듬히 */
  .screen::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      118deg,
      rgb(255 255 255 / 0.16) 0%,
      rgb(255 255 255 / 0.05) 32%,
      transparent 33%,
      transparent 100%
    );
    pointer-events: none;
  }

  /* 노치: 베젤과 같은 검정으로 화면 위 가운데를 살짝 파고듦 */
  .notch {
    position: absolute;
    top: 0;
    left: 50%;
    z-index: 2;
    width: 11%;
    height: 3.6%;
    border-radius: 0 0 8px 8px;
    background: #050506;
    translate: -50% 0;
  }

  .notch::after {
    content: "";
    position: absolute;
    top: 30%;
    left: 50%;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #3a4a6a, #0b0d12 60%);
    translate: -50% 0;
  }

  /* 경첩 */
  .hinge {
    position: relative;
    z-index: 2;
    width: 78%;
    height: 7px;
    margin: 0 auto;
    border-radius: 0 0 6px 6px;
    background: linear-gradient(180deg, #0c0d10, #2b2e34);
  }

  /* 본체: 앞으로 눕힌 면이라 원근 때문에 앞쪽이 넓어지는 사다리꼴로 보임 */
  /* 눕힌 본체가 실제로 차지하는 높이는 스크립트가 재서 정함(--deck-h) */
  .base {
    position: relative;
    height: var(--deck-h, 140px);
    margin-top: -4px;
    perspective: 3200px;
    perspective-origin: 50% 0%;
  }

  .deck {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    aspect-ratio: 1 / 0.56;
    border-radius: 6px 6px 22px 22px;
    background:
      radial-gradient(120% 60% at 50% 0%, rgb(255 255 255 / 0.08), transparent 60%),
      linear-gradient(180deg, #3b3e44 0%, #2c2f34 60%, #24262b 100%);
    box-shadow: inset 0 2px 0 rgb(255 255 255 / 0.12);
    transform: rotateX(77deg);
    transform-origin: 50% 0%;
  }

  .keys {
    position: absolute;
    left: 8%;
    right: 8%;
    top: 7%;
    height: 46%;
    display: grid;
    grid-template-columns: repeat(15, 1fr);
    grid-template-rows: 0.6fr repeat(5, 1fr);
    gap: 1.1%;
    padding: 1%;
    border-radius: 6px;
    background: #121316;
  }

  .keys i {
    border-radius: 3px;
    background: linear-gradient(180deg, #1c1d21, #151619);
    box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.08);
  }

  .keys .space {
    grid-column: span 6;
  }

  .keys .wide {
    grid-column: span 2;
  }

  .trackpad {
    position: absolute;
    left: 32%;
    right: 32%;
    top: 58%;
    height: 34%;
    border-radius: 10px;
    background: linear-gradient(180deg, #34373d, #2e3136);
    box-shadow:
      inset 0 0 0 1px rgb(0 0 0 / 0.35),
      inset 0 1px 0 rgb(255 255 255 / 0.08);
  }

  /* 앞쪽 모서리: 빛을 받는 금속 띠 + 바닥 그림자 */
  /* 앞 모서리는 눕힌 본체의 앞쪽 폭(--lip-w)에 맞춤 */
  .lip {
    position: absolute;
    top: 100%;
    left: 50%;
    width: var(--lip-w, 100%);
    height: 12px;
    translate: -50% 0;
    border-radius: 0 0 14px 14px / 0 0 100% 100%;
    background: linear-gradient(180deg, #8a8e96 0%, #50545b 45%, #2a2c31 100%);
    box-shadow: 0 1px 0 rgb(255 255 255 / 0.25) inset;
  }

  .lip::before {
    content: "";
    position: absolute;
    top: 0;
    left: 50%;
    width: 13%;
    height: 5px;
    border-radius: 0 0 8px 8px;
    background: linear-gradient(180deg, #23252a, #3c3f45);
    translate: -50% 0;
  }

  .lip::after {
    content: "";
    position: absolute;
    left: 4%;
    right: 4%;
    top: 100%;
    height: 30px;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgb(0 0 0 / 0.55), transparent);
  }

  /* 휴대폰: 티타늄 테두리 → 얇은 검은 베젤 → 화면(이미지 원래 비율). 카메라 섬은 화면 위 가운데(빈 헤더 자리) */
  .phone {
    position: absolute;
    right: -5%;
    bottom: -1%;
    width: 21%;
    animation: rise 1s 0.18s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }

  .phoneFrame {
    position: relative;
    padding: 2.2%;
    border-radius: 17% / 8.6%;
    background: linear-gradient(135deg, #9a9ea6, #4b4f56 30%, #2e3136 55%, #6f737b 100%);
    box-shadow:
      0 0 0 1px rgb(0 0 0 / 0.5),
      0 36px 60px -20px rgb(0 0 0 / 0.7);
  }

  .phoneBezel {
    padding: 4%;
    border-radius: 15.5% / 7.9%;
    background: #050506;
  }

  .phoneScreen {
    position: relative;
    overflow: hidden;
    border-radius: 12% / 6.4%;
  }

  .phoneScreen img {
    display: block;
    width: 100%;
    height: auto;
  }

  .phoneScreen::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      125deg,
      rgb(255 255 255 / 0.18) 0%,
      rgb(255 255 255 / 0.04) 38%,
      transparent 39%
    );
  }

  .island {
    position: absolute;
    top: 2.2%;
    left: 50%;
    z-index: 1;
    width: 32%;
    aspect-ratio: 3.3;
    border-radius: 999px;
    background: #000;
    translate: -50% 0;
  }

  /* 옆 버튼 */
  .phone::before,
  .phone::after {
    content: "";
    position: absolute;
    width: 2.4%;
    border-radius: 2px;
    background: linear-gradient(90deg, #3c4047, #8e929a);
  }

  .phone::before {
    left: -1.6%;
    top: 20%;
    height: 11%;
  }

  .phone::after {
    right: -1.6%;
    top: 26%;
    height: 15%;
    background: linear-gradient(90deg, #8e929a, #3c4047);
  }

  @keyframes rise {
    from {
      opacity: 0;
      translate: 0 80px;
    }
  }

  .replay {
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 10;
    padding: 10px 16px;
    border: 0;
    border-radius: 999px;
    background: rgb(32 39 49 / 0.88);
    color: #fff;
    font: 600 13px Pretendard, sans-serif;
    cursor: pointer;
  }

  @media (max-width: 700px) {
    .meta {
      top: 100px;
      right: 6%;
      font-size: 12px;
    }

    .ticker {
      top: 22%;
    }

    .tickerTrack {
      font-size: 13vw;
    }

    .devices {
      top: 30%;
      bottom: auto;
      right: auto;
      left: 4%;
      width: 80%;
    }

    .lid {
      border-radius: 10px 10px 3px 3px;
      padding: 2px;
    }

    .bezel {
      border-radius: 8px 8px 2px 2px;
    }

    .notch::after {
      width: 4px;
      height: 4px;
    }

    .hinge {
      height: 4px;
    }

    .lip {
      height: 7px;
    }

    .keys i {
      border-radius: 1px;
    }

    .text {
      left: 6%;
      right: 6%;
      bottom: 7%;
      max-width: none;
    }

    .title {
      font-size: 16vw;
    }

    .foot p {
      font-size: 14px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .tickerTrack,
    .laptop,
    .phone {
      animation: none;
    }
  }
</style>
</head>
<body>

<section class="panel" aria-label="JAJAK">
  <div class="field" aria-hidden="true"></div>
  <div class="shade" aria-hidden="true"></div>

  <div class="ticker" aria-hidden="true">
    <div class="tickerTrack">
      <span>팀 · 역할 분담 · 담당 페이지 · Git 협업 · GSAP · </span>
      <span>팀 · 역할 분담 · 담당 페이지 · Git 협업 · GSAP · </span>
      <span>팀 · 역할 분담 · 담당 페이지 · Git 협업 · GSAP · </span>
      <span>팀 · 역할 분담 · 담당 페이지 · Git 협업 · GSAP · </span>
    </div>
  </div>

  <div class="meta">
    <span class="badge">작성 예시</span>
    <strong lang="en">React · Git · GSAP</strong>
    <span>팀 · Git 협업</span>
  </div>

  <div class="devices">
    <div class="laptop">
      <div class="lid">
        <div class="bezel">
          <div class="screen">
            <img src="assets/jajak-desktop.webp" width="1907" height="910" alt="JAJAK PC 화면">
          </div>
          <span class="notch" aria-hidden="true"></span>
        </div>
      </div>
      <div class="hinge" aria-hidden="true"></div>
      <div class="base" aria-hidden="true">
        <div class="deck">
          <div class="keys"></div>
          <div class="trackpad"></div>
        </div>
        <div class="lip"></div>
      </div>
    </div>
    <div class="phone">
      <div class="phoneFrame">
        <div class="phoneBezel">
          <div class="phoneScreen">
            <img src="assets/jajak-mobile.webp" width="368" height="665" alt="JAJAK 모바일 화면">
            <span class="island" aria-hidden="true"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="text">
    <h1 class="title">JAJAK</h1>
    <div class="foot">
      <p>AI 기반 전통주 큐레이션 쇼핑몰</p>
      <a href="#">상세 보기 ↗</a>
    </div>
  </div>
</section>

<button class="replay" type="button">기기 등장 다시 보기</button>

<script>
  // 키보드 키: 맨 윗줄(기능키) 15개, 숫자·글자 줄 4줄, 맨 아랫줄(넓은 키 + 스페이스)
  const keys = document.querySelector(".keys");
  const rows = [
    Array(15).fill(""),
    Array(13).fill("").concat("wide"),
    ["wide"].concat(Array(13).fill("")),
    ["wide"].concat(Array(11).fill(""), "wide"),
    ["wide"].concat(Array(11).fill(""), "wide"),
    ["", "", "", "wide", "space", "wide", "", ""],
  ];
  rows.flat().forEach((type) => {
    const key = document.createElement("i");
    if (type) {
      key.className = type;
    }
    keys.append(key);
  });

  // 눕힌 본체의 실제 화면 크기를 재서 자리(높이)와 앞 모서리 폭을 맞춤
  const base = document.querySelector(".base");
  const deck = document.querySelector(".deck");
  const fitDeck = () => {
    const box = deck.getBoundingClientRect();
    base.style.setProperty("--deck-h", box.height + "px");
    base.style.setProperty("--lip-w", box.width + "px");
  };
  fitDeck();
  addEventListener("resize", fitDeck);

  document.querySelector(".replay").addEventListener("click", () => {
    document.querySelectorAll(".laptop, .phone").forEach((device) => {
      device.style.animation = "none";
      device.offsetWidth;
      device.style.animation = "";
    });
  });
</script>
</body>
</html>
